version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the evaluate binary
    cmds:
      - go build -o evaluate ./cmd/evaluate
    sources:
      - cmd/**/*.go
      - cmd/**/*.ts
      - go.mod
      - go.sum
    generates:
      - evaluate

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: Check formatting and vet
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  check:
    desc: Lint and test
    cmds:
      - task: lint
      - task: test

  install:
    desc: Install evaluate into GOBIN
    cmds:
      - go install ./cmd/evaluate

  inspect:
    desc: Open the MCP Inspector against the server
    deps: [build]
    cmds:
      - npx @modelcontextprotocol/inspector ./evaluate mcp

  eval:
    desc: Run the tax-categorization eval for one profile (PROFILE=jev, PROTOCOL=choice|noul, LIMIT=10 for a smoke run)
    deps: [build]
    dir: eval
    cmds:
      - go run ./taxcat run -profile {{.PROFILE}} -protocol {{.PROTOCOL | default "choice"}} -limit {{.LIMIT | default 0}}
    requires:
      vars: [PROFILE]

  eval:score:
    desc: Score every saved eval run as Markdown
    dir: eval
    cmds:
      - go run ./taxcat score

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy
